<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0a0a0a; position:relative; overflow:hidden;
         display:flex; flex-direction:column; justify-content:center; padding:0 92px; font-family:Inter,sans-serif; }
  .glow { position:absolute; width:1000px; height:1000px; border-radius:50%;
          background:radial-gradient(circle, rgba(123,107,143,0.34) 0%, rgba(90,70,120,0.12) 45%, transparent 65%);
          top:-360px; right:-280px; }
  .glow2 { position:absolute; width:760px; height:760px; border-radius:50%;
          background:radial-gradient(circle, rgba(155,139,176,0.20) 0%, transparent 60%);
          bottom:-340px; left:-200px; }
  .label { font-family:Syne; font-weight:700; font-size:20px; letter-spacing:0.26em; text-transform:uppercase;
           color:#888880; margin-bottom:30px; position:relative; }
  h1 { font-family:Syne; font-weight:800; font-size:118px; line-height:1.02; color:#edeae3; position:relative; letter-spacing:-0.01em; }
  h1 .chrome { background:linear-gradient(120deg,#7B6B8F 0%,#E0D4F0 30%,#9B8BB0 55%,#F0E6FF 75%,#D4C6E8 100%);
               -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:29px; font-weight:300; color:#b8b4aa; margin-top:34px; position:relative; }
  .site { font-family:Syne; font-weight:700; font-size:21px; letter-spacing:0.14em; color:#7B6B8F;
          margin-top:40px; text-transform:uppercase; position:relative; }
</style></head><body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="label">Post-Production Studio</div>
  <h1>One Cut.<br><span class="chrome">No Misses.</span></h1>
  <div class="sub">Long-form · Short-form · Podcast editing for YouTube creators &amp; brands</div>
  <div class="site">1cutmedia.com</div>
</body></html>
