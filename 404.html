<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>404 — 1Cut Media</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#0a0a0a; --fg:#edeae3; --fg-mid:#b8b4aa; --fg-dim:#888880; color-scheme: dark; }
    * { margin:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:'Inter',system-ui,sans-serif; padding:24px; }
    .wrap { text-align:center; max-width:520px; }
    .code { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(72px,18vw,140px); line-height:1;
            background:linear-gradient(120deg,#7B6B8F 0%,#E0D4F0 35%,#9B8BB0 60%,#F0E6FF 80%,#D4C6E8 100%);
            -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    h1 { font-family:'Syne',sans-serif; font-weight:700; font-size:clamp(20px,4vw,28px); margin:18px 0 10px; }
    p { color:var(--fg-mid); font-weight:300; line-height:1.7; margin-bottom:32px; }
    a.btn { display:inline-block; background:var(--fg); color:#0a0a0a; font-weight:600; font-size:14px;
            padding:14px 28px; border-radius:999px; text-decoration:none; letter-spacing:0.02em; }
    a.btn:hover { opacity:0.9; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page didn&rsquo;t make the final cut.</h1>
    <p>The link you followed got left on the cutting-room floor. The good stuff is all on the homepage.</p>
    <a class="btn" href="/">Back to 1cutmedia.com</a>
  </div>
</body>
</html>
